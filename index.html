<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <div class="container">

            <div class="container__informaciones">
                <div class="container__texto">
                    <h1></h1>
                    <p class="texto__parrafo"></p>
                </div>
                <input type="text" id="usuario" min="1" max="10" class="container__input">
                <div class="container__texto2">
                    <p2 class="texto__parrafo"></p2>
                </div>
                <input type="password" id="contraseña" min="1" max="100" class="container__input">
                <div class="chute container__botones">
                    <button onclick="login();" class="container__boton">Ingresar</button>
                    
                    <button class="container__boton" id="reiniciar" disabled>Nuevo juego</button>
                </div>
            </div>
            <img src=""  class="container__imagen-persona" />

    </div>




    <script src="app.js" defer></script>
